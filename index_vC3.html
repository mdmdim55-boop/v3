<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    
    <!-- Подключение шрифта Montserrat Regular (400) из Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #194b82;      /* Синий цвет визитки */
            --bg-light: #f4f6f9;     /* Светло-серый фон вокруг карты */
            --card-bg: #ffffff;
            --text-dark: #22252a;
            --text-muted: #7d8590;
            --border-color: #f0f2f5;
        }

        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            font-weight: 400;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер под пропорции мобильного экрана */
        .phone-wrapper {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Синяя шапка */
        .profile-header {
            background-color: var(--primary);
            color: #ffffff;
            text-align: center;
            padding: 45px 20px 25px 20px; /* Скорректирован отступ под кнопки */
            position: relative;
        }

        /* Имя */
        .profile-header h1 {
            font-size: 26px;
            font-weight: 400; 
            margin: 0 0 10px 0;
            letter-spacing: 0.3px;
        }

        /* Должность */
        .profile-header .job-title {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 400;
            margin: 0 0 30px 0; /* Отступ до кнопок быстрого действия */
        }

        /* Блок с тремя круглыми кнопками быстрого действия */
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: absolute;
            bottom: -28px; /* Выносим кнопки наполовину из синей шапки */
            left: 0;
            right: 0;
            z-index: 10;
        }

        /* Круглая кнопка быстрого действия */
        .action-circle {
            width: 56px;
            height: 56px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: var(--primary);
            font-size: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-circle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        /* Контентная зона со строками информации */
        .content-body {
            padding: 50px 20px 100px 20px; /* Увеличен верхний отступ из-за кнопок на плашке */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Карточка строки */
        .info-row {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* Круглый бокс под иконку в списке */
        .icon-box {
            width: 36px;
            height: 36px;
            background-color: #f5f7fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .info-content {
            display: flex;
            flex-direction: column;
        }

        /* Подпись поля */
        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 4px;
        }

        /* Текст внутри поля */
        .info-value {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 400; 
            word-break: break-all;
            text-decoration: none;
        }

        /* Кнопка карты */
        .map-btn {
            display: inline-block;
            background-color: #eaf3fc;
            color: var(--primary);
            font-size: 12px;
            font-weight: 400; 
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            margin-top: 10px;
            align-self: flex-start;
            transition: opacity 0.2s;
        }

        .map-btn:hover {
            opacity: 0.85;
        }

        /* Нижняя фиксированная зона с кнопкой */
        .sticky-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        /* Кнопка Add Contact */
        .add-contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 400; 
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-contact-btn:hover {
            background-color: #123863;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <!-- Шапка визитки -->
        <div class="profile-header">
            <h1>Alexander Trostianezki</h1>
            <p class="job-title">Owner</p>
            
            <!-- ТРИ КРУГЛЫЕ КНОПКИ БЫСТРОГО ДЕЙСТВИЯ -->
            <div class="quick-actions">
                <a href="tel:+4915123066311" class="action-circle" title="Позвонить">📞</a>
                <a href="mailto:alex.trost@optimavisiongroup.com" class="action-circle" title="Написать">✉️</a>
            </div>
        </div>

        <!-- Контакты и ссылки -->
        <div class="content-body">
            
            <!-- Поле: Телефон -->
            <div class="info-row">
                <div class="icon-box">📞</div>
                <div class="info-content">
                    <span class="info-label">Phone</span>
                    <a href="tel:+4915123066311" class="info-value">+49 1512 3066311</a>
                </div>
            </div>

            <!-- Поле: Email -->
            <div class="info-row">
                <div class="icon-box">✉️</div>
                <div class="info-content">
                    <span class="info-label">Email</span>
                    <a href="mailto:alex.trost@optimavisiongroup.com" class="info-value">alex.trost@optimavisiongroup.com</a>
                </div>
            </div>

            <!-- Поле: Сайт -->
            <div class="info-row">
                <div class="icon-box">🌐</div>
                <div class="info-content">
                    <span class="info-label">Website</span>
                    <a href="https://optimavisiongroup.com" target="_blank" class="info-value">optimavisiongroup.com</a>
                </div>
            </div>

            <!-- Поле: Компания -->
            <div class="info-row">
                <div class="icon-box">🏢</div>
                <div class="info-content">
                    <span class="info-label">Optimavisiongroup</span>
                    <span class="info-value">Owner</span>
                </div>
            </div>

        </div>

        <!-- Нижняя фиксированная зона с кнопкой -->
        <div class="sticky-footer">
            <button class="add-contact-btn" onclick="downloadVCard()">
                + Add Contact
            </button>
        </div>
    </div>

    <!-- Логика скачивания vCard-контакта на устройство -->
    <script>
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:Alexander;Trostianezki;;;
FN:Alexander Trostianezki
ORG:Optimavisiongroup
TITLE:Owner
TEL;TYPE=CELL,VOICE:+4915123066311
EMAIL;TYPE=PREF,INTERNET:alex.trost@optimavisiongroup.com
ADR;TYPE=WORK:;;Saperno-Slobidska 10;Kyiv;;03028;Ukraine
URL:https://optimavisiongroup.com
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Vitalii_Kurdiumov.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
